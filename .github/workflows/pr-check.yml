name: Pull Request Checks

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  build-test:
    name: Quick Build Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libsdl2-dev libvulkan-dev

    - name: Configure
      run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

    - name: Build
      run: cmake --build build --parallel 4

    - name: Run Tests
      # Covers the portable math library, the ECS, the Valve block parser and
      # the platform layer, plus the header self-containment check that keeps
      # the cross-platform build from regressing.
      run: ctest --test-dir build --output-on-failure

    - name: Check Binary Size
      run: |
        ls -lh build/bin/ || echo "No binaries built"

  check-files:
    name: Check Modified Files
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check for Large Files
      run: |
        echo "Checking for large files..."
        git diff --name-only origin/${{ github.base_ref }}...HEAD | while read file; do
          if [ -f "$file" ]; then
            size=$(stat -f%z "$file" 2>/dev/null || stat -c%s "$file" 2>/dev/null || echo 0)
            if [ $size -gt 1048576 ]; then
              echo "Warning: $file is larger than 1MB ($size bytes)"
            fi
          fi
        done

    - name: Check for Binary Files
      run: |
        echo "Checking for accidentally committed binaries..."
        git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(exe|dll|so|dylib|a|lib|o)$' && exit 1 || echo "No binaries found"

  lint:
    name: Code Style Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check Line Endings
      run: |
        # .gitattributes declares `*.cpp text eol=crlf`, so a checkout is
        # *supposed* to have CRLF in the working tree. This check used to scan
        # the working tree and therefore failed on every run, on files nobody
        # had touched. What actually matters is that the blobs stored in the
        # repository are LF-normalised, which is what `--cached` inspects.
        echo "Checking that committed source files are LF-normalised..."
        if git grep -I --cached --files-with-matches $'\r' -- '*.cpp' '*.h' '*.hpp'; then
          echo "Found CRLF line endings committed to the repository."
          echo "Re-normalise with: git add --renormalize ."
          exit 1
        fi
        echo "OK: all committed source files are LF-normalised"
