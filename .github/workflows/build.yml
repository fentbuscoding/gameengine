name: Nexus Engine CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build-windows:
    name: Build Windows (Multi-API)
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Vulkan SDK
      run: |
        choco install vulkan-sdk -y
        echo "VULKAN_SDK=C:\VulkanSDK\1.3.290.0" >> $env:GITHUB_ENV
      shell: powershell
      continue-on-error: true

    - name: Setup Dependencies
      run: |
        # SDL2
        $SDL2_VERSION = "2.30.5"
        $SDL2_URL = "https://github.com/libsdl-org/SDL/releases/download/release-$SDL2_VERSION/SDL2-devel-$SDL2_VERSION-VC.zip"
        $SDL2_ZIP = "$env:TEMP\SDL2.zip"

        Write-Host "Downloading SDL2..."
        Invoke-WebRequest -Uri $SDL2_URL -OutFile $SDL2_ZIP

        Write-Host "Extracting SDL2..."
        Expand-Archive -Path $SDL2_ZIP -DestinationPath "$env:TEMP\SDL2-temp" -Force
        New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\thirdparty\SDL2"
        Move-Item -Path "$env:TEMP\SDL2-temp\SDL2-$SDL2_VERSION\*" -Destination "${{ github.workspace }}\thirdparty\SDL2" -Force

        Write-Host "SDL2 setup complete"
      shell: powershell

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pybind11
      shell: powershell
      continue-on-error: true

    - name: Configure CMake (Vulkan + DirectX 11)
      run: |
        cmake -B build `
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} `
          -DENABLE_VULKAN=ON `
          -DENABLE_DIRECTX11=ON `
          -DENABLE_OPENGL=OFF `
          -DENABLE_PYTHON=OFF `
          -DENABLE_EXAMPLES=OFF

    - name: Build
      run: cmake --build build --config ${{env.BUILD_TYPE}} --parallel

    - name: Run Tests
      run: ctest --test-dir build --build-config ${{env.BUILD_TYPE}} --output-on-failure
      shell: powershell

    - name: Check Build Output
      run: |
        # This step used to report failure and then exit 0, so a missing library
        # never turned the job red. Now it actually fails.
        $lib = Get-ChildItem -Path build -Recurse -Filter NexusCore.lib -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($lib) {
          Write-Host "OK: NexusCore.lib at $($lib.FullName)"
        } else {
          Write-Host "FAIL: NexusCore.lib was not produced"
          Get-ChildItem build -Recurse -Include *.lib, *.exe | ForEach-Object { Write-Host $_.FullName }
          exit 1
        }
      shell: powershell

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nexus-engine-windows
        path: |
          build/bin/
          build/lib/
        if-no-files-found: warn

  build-linux:
    name: Build Linux (Vulkan + OpenGL)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          build-essential \
          libsdl2-dev \
          libvulkan-dev \
          vulkan-tools \
          libgl1-mesa-dev \
          libglu1-mesa-dev \
          libx11-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          mesa-vulkan-drivers \
          xvfb

    - name: Setup Dependencies
      run: |
        if [ -f "scripts/setup/setup_dependencies.sh" ]; then
          chmod +x scripts/setup/setup_dependencies.sh
          cd scripts/setup
          ./setup_dependencies.sh
        else
          echo "Setup script not found, skipping..."
        fi
      continue-on-error: true

    - name: Install Python Dependencies
      run: |
        pip3 install --upgrade pip
        pip3 install pybind11
      continue-on-error: true

    - name: Configure CMake (Vulkan + OpenGL)
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DENABLE_VULKAN=ON \
          -DENABLE_DIRECTX11=OFF \
          -DENABLE_OPENGL=ON \
          -DENABLE_PYTHON=OFF \
          -DENABLE_EXAMPLES=OFF

    - name: Build
      run: cmake --build build --config ${{env.BUILD_TYPE}} --parallel $(nproc)

    - name: Run Tests
      run: ctest --test-dir build --output-on-failure

    - name: Run the RHI demo (headless)
      # Compiling the Vulkan backend proves nothing about whether it runs. This
      # opens a real window under Xvfb and presents frames through the software
      # rasteriser, which exercises instance and device creation, swap chain
      # setup, submission and present. The demo exits non-zero if it stops
      # before presenting the requested frames.
      run: |
        set -euo pipefail
        ./build/bin/NexusRHIDemo --probe
        xvfb-run -a -s "-screen 0 1280x720x24" ./build/bin/NexusRHIDemo --frames 30

    - name: Check Build Output
      run: |
        # This step used to print a failure message and still exit 0, so a
        # missing library never turned the job red. An explicit exit makes it a
        # real gate. The library path also varies by generator, so this searches
        # rather than testing two hard-coded paths.
        set -euo pipefail
        if find build -name "libNexusCore.a" | grep -q .; then
          echo "OK: NexusCore library produced"
          find build \( -name "*.a" -o -name "*.so" \) -print
        else
          echo "FAIL: libNexusCore.a was not produced"
          find build -type f -name "*.a" -print
          exit 1
        fi

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nexus-engine-linux
        path: |
          build/bin/
          build/lib/
        if-no-files-found: warn

  build-macos:
    name: Build macOS (Vulkan/MoltenVK)
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        brew update
        brew install cmake sdl2 molten-vk vulkan-headers vulkan-loader

    - name: Setup Dependencies
      run: |
        if [ -f "scripts/setup/setup_dependencies.sh" ]; then
          chmod +x scripts/setup/setup_dependencies.sh
          cd scripts/setup
          ./setup_dependencies.sh
        else
          echo "Setup script not found, skipping..."
        fi
      continue-on-error: true

    - name: Install Python Dependencies
      run: |
        pip3 install --upgrade pip
        pip3 install pybind11
      continue-on-error: true

    - name: Configure CMake (Vulkan/MoltenVK)
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DENABLE_VULKAN=ON \
          -DENABLE_DIRECTX11=OFF \
          -DENABLE_OPENGL=OFF \
          -DENABLE_PYTHON=OFF \
          -DENABLE_EXAMPLES=OFF

    - name: Build
      run: cmake --build build --config ${{env.BUILD_TYPE}} --parallel $(sysctl -n hw.ncpu)

    - name: Run Tests
      run: ctest --test-dir build --output-on-failure

    - name: Probe the RHI demo
      # --probe only: the hosted macOS runners have no window server session, so
      # opening a window is not possible. This still checks the demo links and
      # that the Vulkan backend was compiled in, which is what the macOS-specific
      # MoltenVK work in VulkanDevice.cpp depends on.
      run: |
        set -euo pipefail
        ./build/bin/NexusRHIDemo --probe | tee probe.txt
        grep -q vulkan probe.txt

    - name: Check Build Output
      run: |
        # This step used to print a failure message and still exit 0, so a
        # missing library never turned the job red. An explicit exit makes it a
        # real gate. The library path also varies by generator, so this searches
        # rather than testing two hard-coded paths.
        set -euo pipefail
        if find build -name "libNexusCore.a" | grep -q .; then
          echo "OK: NexusCore library produced"
          find build \( -name "*.a" -o -name "*.dylib" \) -print
        else
          echo "FAIL: libNexusCore.a was not produced"
          find build -type f -name "*.a" -print
          exit 1
        fi

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nexus-engine-macos
        path: |
          build/bin/
          build/lib/
        if-no-files-found: warn

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Check CMake Configuration
      run: |
        echo "Testing minimal CMake configuration..."
        cmake -B build-test \
          -DCMAKE_BUILD_TYPE=Debug \
          -DENABLE_VULKAN=OFF \
          -DENABLE_DIRECTX11=OFF \
          -DENABLE_OPENGL=OFF \
          -DENABLE_PYTHON=OFF \
          -DENABLE_LUA=OFF \
          -DENABLE_JOLT_PHYSICS=ON \
          -DENABLE_EXAMPLES=OFF
        echo "✓ CMake configuration successful"

    - name: Check Source Files
      run: |
        echo "Checking source file structure..."
        test -d "src" && echo "✓ src/ directory exists"
        test -d "include" && echo "✓ include/ directory exists"
        test -f "CMakeLists.txt" && echo "✓ Root CMakeLists.txt exists"
        test -f "src/CMakeLists.txt" && echo "✓ src/CMakeLists.txt exists"

  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check Documentation Files
      run: |
        echo "Checking documentation..."
        test -f "README.md" && echo "✓ README.md found" || echo "✗ README.md missing"
        test -f "QUICKSTART.md" && echo "✓ QUICKSTART.md found"
        test -f "docs/OPENGL_SETUP.md" && echo "✓ OPENGL_SETUP.md found"
        test -f "docs/GAME_IMPORTER_GUIDE.md" && echo "✓ GAME_IMPORTER_GUIDE.md found"
        test -f "docs/PORTABILITY.md" && echo "✓ PORTABILITY.md found"
        echo "Documentation check complete"

  build-summary:
    name: Build Summary
    needs: [build-windows, build-linux, build-macos, code-quality]
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Check Build Status
      run: |
        echo "Build Summary:"
        echo "=============="
        echo "Windows: ${{ needs.build-windows.result }}"
        echo "Linux: ${{ needs.build-linux.result }}"
        echo "macOS: ${{ needs.build-macos.result }}"
        echo "Code Quality: ${{ needs.code-quality.result }}"

  create-release:
    name: Create Release Package
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/

    - name: Create Release Archive
      run: |
        cd artifacts
        zip -r ../nexus-engine-all-platforms.zip .
        cd ..
        ls -lh nexus-engine-all-platforms.zip

    - name: Upload Release Package
      uses: actions/upload-artifact@v4
      with:
        name: nexus-engine-release
        path: nexus-engine-all-platforms.zip
        retention-days: 30
